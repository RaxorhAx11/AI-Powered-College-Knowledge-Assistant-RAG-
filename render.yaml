# Render Blueprint Infrastructure-as-Code Configuration
# See https://render.com/docs/blueprint-spec for details

services:
  - type: web
    name: raxel-college-assistant
    env: python
    region: singapore
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: GEMINI_API_KEY
        sync: false # Render dashboard will prompt user for API key
